<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 42" fill="none">
  <defs>
    <linearGradient id="rankGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Official Brand Mark (Scale: 38px / 2048px = 0.0185546875) -->
  <g transform="translate(2, 2) scale(0.0185546875)">
    <!-- Dark Slate Squircle Background -->
    <rect width="2048" height="2048" rx="420" ry="420" fill="#354a4f" />
    <!-- Top-Left Cyan Bracket -->
    <path d="M 472 472 H 1066 V 552 H 552 V 1066 H 472 Z" fill="#00fefe" />
    <!-- Bottom-Right Cyan Bracket -->
    <path d="M 1576 1576 H 982 V 1496 H 1496 V 982 H 1576 Z" fill="#00fefe" />
    <!-- Center Emerald Growth Arrow -->
    <path d="M 1024 697 H 1350 V 1023 H 1270 V 834 L 715 1389 L 658 1332 L 1213 777 H 1024 Z" fill="#0adb7f" />
    <!-- Bottom-Right Sparkle Accent -->
    <path d="M 1808 1760 Q 1808 1808 1856 1808 Q 1808 1808 1808 1856 Q 1808 1808 1760 1808 Q 1808 1808 1808 1760 Z" fill="#737f82" />
  </g>

  <!-- Typography: LOCKINRANK (Large, high-contrast, impactful) -->
  <text x="47" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5"><tspan fill="#0f172a">LOCKIN</tspan><tspan fill="url(#rankGradient)">RANK</tspan></text>

  <!-- Badge: SHOP -->
  <g transform="translate(216, 9)">
    <rect x="0" y="0" width="54" height="24" rx="6" fill="url(#badgeGradient)" />
    <text x="27" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="900" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">SHOP</text>
  </g>
</svg>
